name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly, catches newly published query packs

permissions:
  contents: read

jobs:
  analyze:
    name: SAST (CodeQL)
    # Free on public repos. Private repos need GitHub Advanced Security (code scanning)
    # enabled in Settings -> Code security; opt in by setting the repository variable
    # ENABLE_CODE_SCANNING=true once it is on, otherwise the SARIF upload fails.
    if: ${{ !github.event.repository.private || vars.ENABLE_CODE_SCANNING == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning
      actions: read # required by CodeQL on private repositories to read workflow run metadata
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
